  # 🔍 Full filesystem scan every Sunday
  trufflehog-full:
    name: Full Repo Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog (filesystem)
        run: |
          docker run --rm -v "${{ github.workspace }}:/pwd" \
            trufflesecurity/trufflehog:latest \
            filesystem /pwd \
            --results=verified,unverified \
            --no-update \
            --fail