name: Secret Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        run: |
          docker run --rm -v "${{ github.workspace }}:/pwd" \
            trufflesecurity/trufflehog:latest \
            filesystem /pwd \
            --results=verified,unverified \
            --no-update \
            --fail  # ← this makes the job FAIL and blocks the PR