name: Nikto - Web Server Scan
# DAST tool for web server misconfigurations and known-vulnerable files
on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nikto-scan:
    runs-on: ubuntu-latest
    name: Nikto Web Server Scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Flask
        run: |
          python -m pip install --upgrade pip
          pip install flask

      - name: Install Nikto
        run: |
          sudo apt-get update -y
          sudo apt-get install -y nikto
          nikto -Version

      - name: Start vulnerable demo app
        run: |
          nohup python vuln_app.py &
          echo "Waiting for Flask to start..."
          for i in $(seq 1 15); do
            if curl -sf http://127.0.0.1:5000/login > /dev/null; then
              echo "Flask is up!"
              break
            fi
            echo "Attempt $i: not ready yet..."
            sleep 2
          done

      - name: Run Nikto scan
        run: |
          mkdir -p nikto-report
          nikto \
            -h http://127.0.0.1:5000/ \
            -ask no \
            -nossl \
            -Format json \
            -o nikto-report/scan.json \
            2>&1 | tee nikto-report/scan.log

      - name: Generate HTML report
        if: always()
        run: |
          nikto \
            -h http://127.0.0.1:5000/ \
            -ask no \
            -nossl \
            -Format html \
            -o nikto-report/report.html \
            2>/dev/null || true

      - name: Print Vulnerability Summary
        if: always()
        run: |
          echo "========================================"
          echo "        Nikto Vulnerability Summary     "
          echo "========================================"
          if [ -f nikto-report/scan.json ]; then
            python3 -c "
          import json
          with open('nikto-report/scan.json') as f:
              report = json.load(f)
          vulns = report.get('vulnerabilities', [])
          total = len(vulns)
          if total == 0:
              print('  No findings in JSON report.')
          else:
              for v in vulns:
                  print(f\"  - {v.get('msg', 'Unknown finding')}\")
              print(f'  Total: {total} findings')
          "
          else
            echo "  No JSON report found."
          fi

      - name: Upload Nikto Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nikto-report
          path: nikto-report/
          retention-days: 30
          if-no-files-found: warn
