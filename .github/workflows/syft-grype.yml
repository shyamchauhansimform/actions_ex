name: SBOM Generation and Dependency Vulnerability Scan

on:
  schedule:
    - cron: '0 8 * * *'
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syft-grype-scan:
    name: SBOM Generation (Syft) + Vulnerability Scan (Grype)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to upload SARIF results to the GitHub Security tab
      security-events: write

    steps:
      # ── 1. Checkout so Syft can walk the full source tree ──────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Install Syft via official install script ────────────────────────
      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      # ── 3. Generate SBOM — CycloneDX JSON is the format Grype natively reads
      - name: Generate SBOM with Syft
        run: syft . -o cyclonedx-json=sbom.cyclonedx.json

      # ── 4. Upload SBOM so it can be audited or consumed by downstream tools ─
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.run_number }}
          path: sbom.cyclonedx.json
          retention-days: 30

      # ── 5. Install Grype via official install script ───────────────────────
      - name: Install Grype
        run: curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      # ── 6. Scan the SBOM — exit 0 so the pipeline never blocks on findings ─
      - name: Scan SBOM with Grype
        run: grype sbom:sbom.cyclonedx.json -o sarif > grype-results.sarif; true

      # ── 7. Surface findings in the GitHub Security tab ─────────────────────
      - name: Upload Grype SARIF to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: grype-results.sarif

      # ── 8. Keep raw SARIF as a downloadable artifact ───────────────────────
      - name: Upload Grype SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-sarif-${{ github.run_number }}
          path: grype-results.sarif
          if-no-files-found: ignore
          retention-days: 30
